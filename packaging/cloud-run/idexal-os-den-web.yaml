apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: idexal-os-den-web
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
    spec:
      serviceAccountName: idexal-os-cloud-run@REPLACE_PROJECT_ID.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: REPLACE_REGION-docker.pkg.dev/REPLACE_PROJECT_ID/idexalos/idexal-os-den-web:REPLACE_IDEXAL_VERSION
          ports:
            - name: http1
              containerPort: 3005
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          env:
            - { name: NODE_ENV, value: production }
            - { name: CI, value: "true" }
            - { name: DEN_BASE_URL, value: REPLACE_WEB_ORIGIN }
            - { name: DEN_WEB_PUBLIC_ORIGIN, value: REPLACE_WEB_ORIGIN }
            - { name: DEN_AUTH_ORIGIN, value: REPLACE_WEB_ORIGIN }
            - { name: DEN_WEB_IDEXAL_AUTH_CALLBACK_URL, value: REPLACE_WEB_ORIGIN }
            - { name: DEN_API_BASE, value: REPLACE_API_ORIGIN }
            - { name: DEN_API_PUBLIC_URL, value: REPLACE_API_ORIGIN }
