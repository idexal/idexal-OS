{{- include "idexal-os-ee.gateway.validate" . }}
{{- include "idexal-os-ee.customCa.validate" . }}
{{- $gateway := include "idexal-os-ee.gateway" . | fromYaml }}
{{- if $gateway.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "idexal-os-ee.inferenceServiceName" . }}
  labels:
    {{- include "idexal-os-ee.componentLabels" (dict "root" . "component" "inference") | nindent 4 }}
  {{- with $gateway.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $gateway.service.type }}
  {{- with $gateway.service.loadBalancerClass }}
  loadBalancerClass: {{ . | quote }}
  {{- end }}
  {{- with $gateway.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  ports:
    - name: http
      port: {{ $gateway.service.port }}
      targetPort: http
  selector:
    {{- include "idexal-os-ee.componentSelectorLabels" (dict "root" . "component" "inference") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "idexal-os-ee.fullname" . }}-inference
  labels:
    {{- include "idexal-os-ee.componentLabels" (dict "root" . "component" "inference") | nindent 4 }}
spec:
  replicas: {{ $gateway.replicaCount }}
  selector:
    matchLabels:
      {{- include "idexal-os-ee.componentSelectorLabels" (dict "root" . "component" "inference") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "idexal-os-ee.componentSelectorLabels" (dict "root" . "component" "inference") | nindent 8 }}
        {{- with $gateway.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with $gateway.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.customCa.enabled }}
      volumes:
        {{- include "idexal-os-ee.customCa.volume" . | nindent 8 }}
      {{- end }}
      containers:
        - name: inference
          image: "{{ $gateway.image.repository }}:{{ include "idexal-os-ee.imageTag" (dict "root" . "componentTag" $gateway.image.tag) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $gateway.containerPort }}
          {{- if .Values.customCa.enabled }}
          volumeMounts:
            {{- include "idexal-os-ee.customCa.volumeMount" . | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "idexal-os-ee.configName" . }}
            - secretRef:
                name: {{ include "idexal-os-ee.secretName" . }}
          env:
            - name: PORT
              value: {{ $gateway.containerPort | quote }}
            {{- if .Values.customCa.enabled }}
            {{- include "idexal-os-ee.customCa.env" . | nindent 12 }}
            {{- end }}
            {{- range $key, $value := $gateway.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- include "idexal-os-ee.gatewayDeploymentEnv" (dict "root" . "env" $gateway.env) | nindent 12 }}
            {{- include "idexal-os-ee.gatewayTokenEnv" . | nindent 12 }}
          {{- with $gateway.probes.liveness }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $gateway.probes.readiness }}
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $gateway.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
