{{- include "idexal-os-ee.gateway.validate" . }}
{{- $gateway := include "idexal-os-ee.gateway" . | fromYaml }}
{{- if and $gateway.enabled $gateway.retention.enabled }}
{{- /* Reused values from older charts may lack the batch keys; fall back to the chart defaults. */}}
{{- $batch := dict "maxBucketsPerRun" (int (default 48 $gateway.retention.maxBucketsPerRun)) "maxSourceRowsPerBucket" (int (default 5000 $gateway.retention.maxSourceRowsPerBucket)) }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "idexal-os-ee.fullname" . }}-inference-retention
  labels:
    {{- include "idexal-os-ee.componentLabels" (dict "root" . "component" "inference-retention") | nindent 4 }}
spec:
  schedule: {{ $gateway.retention.schedule | quote }}
  timeZone: {{ $gateway.retention.timeZone | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        spec:
          restartPolicy: Never
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: retention
              image: "{{ $gateway.image.repository }}:{{ include "idexal-os-ee.imageTag" (dict "root" . "componentTag" $gateway.image.tag) }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["node", "--input-type=module", "-e"]
              args:
                - |
                  try {
                    const response = await fetch(process.env.ROLLUP_URL, {
                      method: "POST",
                      headers: { authorization: `Bearer ${process.env.GATEWAY_ADMIN_TOKEN}`, "content-type": "application/json" },
                      body: process.env.ROLLUP_BODY,
                      signal: AbortSignal.timeout(600000),
                    });
                    const body = await response.text();
                    if (!response.ok) throw new Error(String(response.status));
                    // The summary is row and bucket counts only.
                    console.log("Gateway retention batch completed", body);
                  } catch (error) {
                    console.error("Gateway retention batch failed", error instanceof Error ? error.message : "");
                    process.exitCode = 1;
                  }
              env:
                - name: ROLLUP_URL
                  value: "http://{{ include "idexal-os-ee.inferenceServiceName" . }}:{{ $gateway.service.port }}/internal/rollups/run"
                - name: ROLLUP_BODY
                  value: {{ toJson $batch | quote }}
                {{- range $name := list "GATEWAY_ADMIN_TOKEN" "INFERENCE_ADMIN_TOKEN" }}
                - name: {{ $name }}
                  valueFrom:
                    secretKeyRef:
                      name: {{ $gateway.retention.adminTokenSecret | quote }}
                      key: {{ $gateway.retention.adminTokenKey | quote }}
                      optional: false
                {{- end }}
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
{{- end }}
