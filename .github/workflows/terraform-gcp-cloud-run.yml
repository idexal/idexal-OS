name: Terraform GCP Cloud Run module

on:
  pull_request:
    paths:
      - "infra/terraform/modules/idexal-os-gcp-cloud-run/**"
      - ".github/workflows/terraform-gcp-cloud-run.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install verified Terraform
        run: |
          curl -fsSLo /tmp/terraform.zip https://releases.hashicorp.com/terraform/1.16.5/terraform_1.16.5_linux_amd64.zip
          echo '2bc2fcfff033265c9e02ca0351f01794eb122f62a9b2a49a3294b9e49eaab5e4  /tmp/terraform.zip' | sha256sum -c -
          unzip -q /tmp/terraform.zip -d /tmp/terraform-bin
          echo /tmp/terraform-bin >> "$GITHUB_PATH"
      - name: Install verified OpenTofu
        run: |
          curl -fsSLo /tmp/tofu.zip https://github.com/opentofu/opentofu/releases/download/v1.11.14/tofu_1.11.14_linux_amd64.zip
          echo '8279a6c6d4044899ae77190fc50c40c147615a76aca13ea605d68320c424c2a6  /tmp/tofu.zip' | sha256sum -c -
          mkdir -p /tmp/tofu-bin
          unzip -q /tmp/tofu.zip -d /tmp/tofu-bin
          echo /tmp/tofu-bin >> "$GITHUB_PATH"
      - name: Format, validate and offline tests (mocked Google provider)
        working-directory: infra/terraform/modules/idexal-os-gcp-cloud-run
        run: |
          terraform fmt -check -recursive
          # Reusable modules declare constraints; only root examples ship locks.
          terraform init -backend=false -input=false
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate
          terraform test
          (cd examples/complete && terraform init -backend=false -input=false -lockfile=readonly && terraform validate)
          # A lock belongs to one registry. Regenerate explicitly when switching tools.
          rm .terraform.lock.hcl
          tofu init -backend=false -input=false
          tofu init -backend=false -input=false -lockfile=readonly
          tofu validate
          tofu test
          (cd examples/complete && rm .terraform.lock.hcl && tofu init -backend=false -input=false && tofu init -backend=false -input=false -lockfile=readonly && tofu validate)
