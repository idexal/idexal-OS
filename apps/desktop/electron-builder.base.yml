directories:
  output: dist-electron
toolsets:
  appimage: "1.0.3"
files:
  - electron/**/*
  - server/**/*
  - "!server/dist/opencode-plugins/**"
  - package.json
  - from: .electron-runtime/node_modules
    to: node_modules
extraResources:
  - from: .electron-runtime/idexal-os-sentry.json
    to: idexal-os-sentry.json
  - from: ../app/dist
    to: app-dist
  - from: server/dist/opencode-plugins
    to: opencode-plugins
    filter:
      - "*.js"
      - "*.wasm"
  - from: ../../packages/docs
    to: idexal-os-docs
    filter:
      - "**/*.md"
      - "**/*.mdx"
      - "docs.json"
asar: true
asarUnpack:
  - node_modules/.pnpm/@lydell+node-pty*/**
  - node_modules/node-pty/**
npmRebuild: false
afterPack: scripts/electron-after-pack.cjs
afterSign: scripts/electron-after-sign.cjs
publish:
  - provider: github
    owner: idexal
    repo: idexalOs
    releaseType: release
mac:
  icon: resources/icons/icon.icns
  category: public.app-category.developer-tools
  minimumSystemVersion: "12.0"
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: idexal Os uses the microphone when you allow a page to access audio input.
  extraResources:
    - from: resources/sidecars
      to: sidecars
      filter:
        - opencode
        - opencode2
        - opencode-aarch64-apple-darwin
        - opencode2-aarch64-apple-darwin
        - opencode-x86_64-apple-darwin
        - opencode2-x86_64-apple-darwin
        - versions.json
        - versions.json-aarch64-apple-darwin
        - versions.json-x86_64-apple-darwin
  target:
    - dmg
    - zip
dmg:
  title: "idexal Os ${version}"
  icon: resources/icons/icon.icns
  background: build/dmg-background.png
  iconSize: 112
  window:
    width: 540
    height: 380
  contents:
    - x: 140
      y: 196
    - x: 400
      y: 196
      type: link
      path: /Applications
linux:
  icon: resources/icons/linux
  syncDesktopName: true
  category: Development
  mimeTypes:
    - x-scheme-handler/idexalos
  desktop:
    entry:
      Name: idexal Os
      Comment: Local-first AI workspace for your own files
      Categories: Development;Utility;
      Keywords: AI;agent;workspace;desktop;
      MimeType: x-scheme-handler/idexalos;
      StartupWMClass: idexalos
  extraResources:
    - from: resources/icons/linux
      to: icons/linux
      filter:
        - "*.png"
    - from: resources/sidecars
      to: sidecars
      filter:
        - opencode
        - opencode2
        - opencode-aarch64-unknown-linux-gnu
        - opencode2-aarch64-unknown-linux-gnu
        - opencode-x86_64-unknown-linux-gnu
        - opencode2-x86_64-unknown-linux-gnu
        - versions.json
        - versions.json-aarch64-unknown-linux-gnu
        - versions.json-x86_64-unknown-linux-gnu
  target:
    - AppImage
    - deb
    - rpm
    - tar.gz
deb:
  # fpm takes the package name from productName by default, which contains a
  # space ("idexal Os") and rpmbuild rejects it. This is the package name, not
  # the app or executable name.
  packageName: idexal-os
  afterInstall: build/linux/after-install.sh
  afterRemove: build/linux/after-remove.sh
rpm:
  packageName: idexal-os
  afterInstall: build/linux/after-install.sh
  afterRemove: build/linux/after-remove.sh
win:
  icon: resources/icons/icon.ico
  extraResources:
    - from: resources/icons/icon.png
      to: icons/icon.png
    - from: resources/sidecars
      to: sidecars
      filter:
        - opencode.exe
        - opencode2.exe
        - opencode-aarch64-pc-windows-msvc.exe
        - opencode2-aarch64-pc-windows-msvc.exe
        - opencode-x86_64-pc-windows-msvc.exe
        - opencode2-x86_64-pc-windows-msvc.exe
        - versions.json
        - versions.json-aarch64-pc-windows-msvc.exe
        - versions.json-x86_64-pc-windows-msvc.exe
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: idexal Os
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  license: build/license.txt
  installerIcon: resources/icons/icon.ico
  uninstallerIcon: resources/icons/icon.ico
  installerHeader: build/installerHeader.bmp
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/installerSidebar.bmp
  include: build/installer.nsh
  artifactName: idexal-os-setup-${version}-${arch}.${ext}
